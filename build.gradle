buildscript {
    ext {
        kotlin_version = '2.1.10'
        room_version = '2.7.2'
    }
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
        classpath 'com.google.gms:google-services:4.4.2'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.3'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "org.jetbrains.kotlin:kotlin-serialization:$kotlin_version"
        classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:$kotlin_version"
        classpath "androidx.room:room-gradle-plugin:$room_version"
    }
}

plugins {
    id 'com.google.devtools.ksp' version '2.1.10-1.0.31'
}

allprojects {
    repositories {
        maven { url 'https://jitpack.io' }
        google()
        mavenCentral()
    }
}

def getReleaseVersionCode() {
    def versionCode = (int) (new Date().getTime() / 1000)
    println('versionCode: ' + versionCode)
    return versionCode
}

def getReleaseVersionName() {
    def subVersion = '0'
    def versionName = new Date().format('yyyy.Mdd') + '.' + subVersion
    println('versionName: ' + versionName)
    return versionName
}

def localProperties = new Properties()
def localPropertiesFile = new File(rootDir.getAbsolutePath(), 'local.properties')
if (localPropertiesFile.exists()) {
    localProperties.load(localPropertiesFile.newDataInputStream())
}

apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'
apply plugin: 'kotlin-android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'org.jetbrains.kotlin.plugin.serialization'
apply plugin: 'androidx.room'

android {
    namespace 'app.mosu'
    compileSdk 36
    ndkVersion '22.1.7171670'

    defaultConfig {
        applicationId 'app.mosu'
        minSdkVersion 24
        targetSdkVersion 29
        versionCode getReleaseVersionCode()
        versionName getReleaseVersionName()
        multiDexEnabled true
        ndk {
            abiFilters 'x86', 'x86_64', 'armeabi-v7a', 'arm64-v8a'
        }
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/proguard/coroutines.pro']
        }
    }

    room {
        schemaDirectory "$projectDir/schemas"
    }

    signingConfigs {
        debug {
            storeFile file('debug.jks')
            storePassword "debug.dgsrz.com"
            keyAlias 'debug.github.dgsrz.com'
            keyPassword 'debug.github.dgsrz.com'
        }

        release {
            try {
                storeFile file(localProperties.get("RELEASE_KEYSTORE", "debug.jks"))
                storePassword localProperties.get('RELEASE_KEYSTORE_PASSWORD', "debug.dgsrz.com")
                keyAlias localProperties.get('RELEASE_KEY_ALIAS', "debug.github.dgsrz.com")
                keyPassword localProperties.get('RELEASE_KEY_PASSWORD', "debug.github.dgsrz.com")
            } catch (ignored) {
                throw new InvalidUserDataException('You should define RELEASE_KEYSTORE_PASSWORD and RELEASE_KEY_PASSWORD in local.properties.', ignored)
            }
        }
    }

    buildTypes {
        debug {
            resValue "string", "app_name", "mosu-debug"
            applicationIdSuffix '.debug'
            firebaseCrashlytics {
                mappingFileUploadEnabled false
            }
        }

        release {
            resValue "string", "app_name", "mosu"
//            minifyEnabled true
//            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard.cfg', 'proguard-kotlin.pro'
            signingConfig signingConfigs.release
            firebaseCrashlytics {
                mappingFileUploadEnabled false
            }
        }

        pre_release {
            matchingFallbacks = ['release']
            resValue "string", "app_name", "mosu"
//            minifyEnabled true
//            debuggable true
//            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard.cfg', 'proguard-kotlin.pro'
            signingConfig signingConfigs.release
            firebaseCrashlytics {
                mappingFileUploadEnabled false
            }
        }
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
            jniLibs.srcDirs = ['libs']
        }
        test.setRoot("$projectDir/tests/test")

        // We need to add the Room schemas not as a *test* resource, but as a build asset.
        // See https://github.com/robolectric/robolectric/issues/3928#issuecomment-395309991 for more details.
        debug.assets.srcDirs += files("$projectDir/schemas".toString())
        release.assets.srcDirs += files("$projectDir/schemas".toString())
        pre_release.assets.srcDirs += files("$projectDir/schemas".toString())
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        kotlinOptions {
            jvmTarget = '17'
            freeCompilerArgs += ['-Xjvm-default=all']
        }
    }

    useLibrary 'org.apache.http.legacy'
    lint {
        abortOnError true
        disable 'MissingTranslation', 'ExpiredTargetSdkVersion', 'ProtectedPermissions', 'AppLinkUrlError'
        ignoreWarnings true
    }
    buildFeatures {
        buildConfig true
        compose true
    }

    testOptions {
        unitTests {
            includeAndroidResources true
        }
    }

    android.applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            def fileName = "mosu-${defaultConfig.versionName}-${variant.buildType.name}.apk"
            outputFileName = fileName
        }
    }
}

dependencies {
    implementation project(':AndEngine')
    implementation project(':LibBASS')
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.android.material:material:1.11.0'

    // Jetpack Compose + Material 3 (Expressive)
    implementation platform('androidx.compose:compose-bom:2025.06.01')
    implementation 'androidx.compose.material3:material3:1.5.0-alpha14'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.activity:activity-compose:1.10.1'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    implementation 'com.google.firebase:firebase-crashlytics:19.4.0'
    implementation 'com.google.firebase:firebase-analytics:22.2.0'
    implementation 'com.google.firebase:firebase-messaging:24.1.0'

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.12.1'
    implementation 'pub.devrel:easypermissions:3.0.0'
    implementation 'net.lingala.zip4j:zip4j:2.11.5'

    implementation 'com.github.EdrowsLuo.EdlGameFramework:EdlJavaExt:d91c53fcff'
    implementation 'com.github.EdrowsLuo.EdlGameFramework:EdlOsbSupport:d91c53fcff'

    // Localizations
    implementation 'com.github.osudroid:language-pack:2026.0606.2'

    // Tools
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.8.0"
    implementation 'commons-io:commons-io:2.18.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'

    // Multiplayer
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.1'
    implementation "org.jetbrains.kotlin:kotlin-reflect:$kotlin_version"
    implementation ('io.socket:socket.io-client:2.1.1') {
        exclude group: 'org.json', module: 'json'
    }

    // Video playback
    implementation "androidx.media3:media3-exoplayer:1.4.1"
    implementation files('libs/media3-decoder-ffmpeg.aar')

    // Room
    implementation "androidx.room:room-runtime:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"
    ksp "androidx.room:room-compiler:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    testImplementation "androidx.room:room-testing:$room_version"
}


// ---------------------------------------------------------------------------------------------
// Signing tasks
// ---------------------------------------------------------------------------------------------

// Generates a release keystore and writes its credentials to local.properties (read by signingConfigs.release).
//   ./gradlew generateKeystore [-PkeystorePassword=...] [-PkeyAlias=mosu] [-PkeystoreFile=mosu-release.jks]
tasks.register('generateKeystore') {
    group = 'signing'
    description = 'Generates a release keystore and stores its credentials in local.properties.'

    doLast {
        def keystore = file(project.findProperty('keystoreFile') ?: 'mosu-release.jks')
        def alias = project.findProperty('keyAlias') ?: 'mosu'
        def password = project.findProperty('keystorePassword') ?: UUID.randomUUID().toString().replace('-', '')

        if (keystore.exists()) {
            throw new GradleException("$keystore already exists, refusing to overwrite it.")
        }

        exec {
            commandLine 'keytool', '-genkeypair', '-v',
                    '-keystore', keystore.absolutePath,
                    '-alias', alias,
                    '-keyalg', 'RSA', '-keysize', '4096', '-validity', '10000',
                    '-storepass', password, '-keypass', password,
                    '-dname', 'CN=mosu, O=mosu, C=US'
        }

        def props = new Properties()
        if (localPropertiesFile.exists()) {
            localPropertiesFile.withInputStream { props.load(it) }
        }
        props.setProperty('RELEASE_KEYSTORE', keystore.absolutePath)
        props.setProperty('RELEASE_KEYSTORE_PASSWORD', password)
        props.setProperty('RELEASE_KEY_ALIAS', alias)
        props.setProperty('RELEASE_KEY_PASSWORD', password)
        localPropertiesFile.withOutputStream { props.store(it, null) }

        println("Keystore: $keystore")
        println("Credentials saved to local.properties. Back the keystore up: losing it means no updates.")
    }
}

// Verifies that the release APK is signed (and with which certificate).
tasks.register('verifyReleaseSignature') {
    group = 'signing'
    description = 'Runs apksigner verify on the assembled release APK.'
    dependsOn 'assembleRelease'

    doLast {
        def apk = fileTree(dir: "$buildDir/outputs/apk/release", include: '*.apk').files.max { it.lastModified() }
        def sdk = System.getenv('ANDROID_HOME') ?: localProperties.getProperty('sdk.dir')
        def apksigner = file("$sdk/build-tools").listFiles()?.sort { it.name }?.reverse()
                ?.collect { new File(it, 'apksigner') }?.find { it.exists() }

        if (apk == null || apksigner == null) {
            throw new GradleException('Release APK or apksigner not found.')
        }

        exec { commandLine apksigner.absolutePath, 'verify', '--verbose', '--print-certs', apk.absolutePath }
    }
}
