name: Android

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble-debug:
    name: Assemble Debug APK
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup JDK 17 and Gradle
      uses: ./.github/actions/setup-java-gradle

    - name: Assemble debug APK
      run: ./gradlew assembleDebug

  assemble-pre-release:
    name: Assemble Pre-Release APK
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup JDK 17 and Gradle
      uses: ./.github/actions/setup-java-gradle

    - name: Assemble pre-release APK
      run: ./gradlew assemblePre_release

  assemble-release:
    name: Assemble Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Set up JDK 17 and Gradle
      uses: ./.github/actions/setup-java-gradle

    - name: Assemble release APK
      run: ./gradlew assembleRelease

    - name: Upload release APK
      uses: actions/upload-artifact@v7
      with:
        name: mosu-release-apk
        path: build/outputs/apk/release/*.apk
        if-no-files-found: error

    # Keeps a "nightly" pre-release with the APK of the latest commit on master.
    - name: Publish nightly release
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        apk=$(ls build/outputs/apk/release/*.apk | head -n 1)
        version=$(basename "$apk" | sed -E 's/^mosu-(.*)-release\.apk$/\1/')

        gh release delete nightly --yes --cleanup-tag || true
        gh release create nightly "$apk" \
          --target "$GITHUB_SHA" \
          --prerelease \
          --title "mosu $version (nightly)" \
          --notes "Automatic build of ${GITHUB_SHA::9} from master. Install the APK on Android 7.0 or newer."

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Set up JDK 17 and Gradle
      uses: ./.github/actions/setup-java-gradle

    - name: Run tests
      run: ./gradlew testDebugUnitTest

    - name: Upload test results
      if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        name: reports
        path: |
          **/build/reports/
          **/build/test-results/